<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder 1e Monster Database</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="themes.css">
    <style>
        body { padding: 20px; overflow-y: auto; }
        .database-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .database-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: var(--sb-red); border-color: var(--sb-red); }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); flex-wrap: wrap;}
        .filters input, .filters select { padding: 8px; border-radius: 4px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; }
        .filters input { flex: 2; min-width: 200px; }
        .filters select { flex: 1; min-width: 100px; }
        
        .monster-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 12px; }
        .monster-card { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border-color); transition: all 0.2s;}
        .monster-card:hover { border-color: var(--sb-red); background: rgba(0,0,0,0.6); }
        .monster-info { flex: 1; min-width: 0; overflow: hidden; padding-right: 10px; }
        .monster-info h3 { margin: 0 0 5px 0; color: #fff; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .monster-info p { margin: 0; color: #aaa; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .monster-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        
        .star-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.3; transition: all 0.2s; filter: grayscale(100%); }
        .star-btn:hover { opacity: 0.8; transform: scale(1.1); }
        .star-btn.active { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; align-items: center; }
        .pagination button { padding: 6px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: #fff; cursor: pointer; border-radius: 4px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="database-header">
        <h1>Monster Database</h1>
        <a href="index.html" class="btn primary">⬅ Back to Editor</a>
    </div>

    <div id="view-main" class="tab-content">
        <div class="filters">
            <input type="text" id="filter-name" placeholder="Search by name...">
            <select id="filter-cr">
                <option value="">Any CR</option>
                <!-- populated by js -->
            </select>
            <select id="filter-type">
                <option value="">Any Type</option>
                <option value="aberration">Aberration</option>
                <option value="animal">Animal</option>
                <option value="construct">Construct</option>
                <option value="dragon">Dragon</option>
                <option value="fey">Fey</option>
                <option value="humanoid">Humanoid</option>
                <option value="magical beast">Magical Beast</option>
                <option value="monstrous humanoid">Monstrous Humanoid</option>
                <option value="ooze">Ooze</option>
                <option value="outsider">Outsider</option>
                <option value="plant">Plant</option>
                <option value="undead">Undead</option>
                <option value="vermin">Vermin</option>
            </select>
            <select id="filter-alignment">
                <option value="">Any Alignment</option>
                <option value="lg">LG (Lawful Good)</option>
                <option value="ng">NG (Neutral Good)</option>
                <option value="cg">CG (Chaotic Good)</option>
                <option value="ln">LN (Lawful Neutral)</option>
                <option value="n">N (True Neutral)</option>
                <option value="cn">CN (Chaotic Neutral)</option>
                <option value="le">LE (Lawful Evil)</option>
                <option value="ne">NE (Neutral Evil)</option>
                <option value="ce">CE (Chaotic Evil)</option>
            </select>
            <select id="filter-environment">
                <option value="">Any Environment</option>
                <option value="aquatic">Aquatic (Water)</option>
                <option value="desert">Desert</option>
                <option value="forest">Forest / Jungle</option>
                <option value="hills">Hills</option>
                <option value="mountains">Mountains</option>
                <option value="plains">Plains</option>
                <option value="ruins">Ruins</option>
                <option value="swamp">Swamp / Marsh</option>
                <option value="underground">Underground</option>
                <option value="urban">Urban (City)</option>
            </select>
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="favorites">⭐ Favorites</option>
                <option value="official_monster">Official Monsters</option>
                <option value="official_npc">Official NPCs</option>
                <option value="custom">My Homebrew (Customs)</option>
                <option value="unique_monster">Unique Monsters</option>
                <option value="3pp_monster">3rd Party (3PP) Monsters</option>
            </select>
            <select id="filter-sort">
                <option value="default" selected>Sort: Alphabetical (A-Z)</option>
                <option value="newest">Sort: Newest First</option>
                <option value="cr_desc">Sort: CR (Highest to Lowest)</option>
                <option value="cr_asc">Sort: CR (Lowest to Highest)</option>
                <option value="name_desc">Sort: Alphabetical (Z-A)</option>
            </select>
        </div>

        <div class="monster-list" id="main-list">
            <div style="text-align: center; color: #aaa; padding: 20px;">Loading database...</div>
        </div>

        <div class="pagination">
            <button id="btn-prev">Previous</button>
            <span id="page-info">Page 1 of ?</span>
            <button id="btn-next">Next</button>
        </div>
    </div>

    <script src="database.js"></script>
</body>
</html>
